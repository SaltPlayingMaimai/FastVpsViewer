<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FastVpsViewer</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/assets/style.css" />
  </head>
  <body>
    <header class="bar">
      <span class="dot" id="dot" data-state="starting"></span>
      <span class="label" id="label">正在连接…</span>
      <span class="spacer"></span>
      <span class="meta" id="meta"></span>
      <button id="release" class="btn" type="button" title="结束会话并释放远端资源">结束并释放</button>
    </header>
    <main id="screen-wrap">
      <div id="screen"></div>
      <div id="overlay" class="overlay" hidden>
        <p id="overlay-text"></p>
        <button id="retry" class="btn" type="button">重新连接</button>
      </div>
    </main>
    <script type="module" src="/assets/app.js"></script>
  </body>
</html>

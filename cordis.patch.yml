# FastVpsViewer: on-demand Openbox desktop from your VPS.
#
# The row is inserted into the DSH profile by installing this bundle.
# Every field is optional; the values below are the defaults.
- insert:
    - id: fast-vps-viewer
      name: fast-vps-viewer
      config:
        # ssh alias from ~/.ssh/config (or user@host / plain host)
        sshHost: my-vps
        sshPort: 22
        sshUser: ''
        # agent | key | password (password and key paths stay on this machine)
        auth: agent
        identityFile: ''
        # extra ssh args, e.g. ['-o', 'ProxyJump=bastion']
        sshOptions: []
        # remote X display number and RFB port
        display: 1
        vncPort: 5901
        # local loopback port that serves the noVNC viewer
        viewerPort: 19600
        geometry: 1600x900
        # let the remote desktop follow the panel size
        autoResize: true
        desktop: openbox
        startupCommands: ['browser']
        # release policy
        idleMinutes: 1
        maxSessionMinutes: 120
        remoteIdleSeconds: 3600
